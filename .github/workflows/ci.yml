name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # macOS, as the tests run in its sandbox (scripts/test-isolated).
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The personal-data scan reads the whole history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The sandbox denies the network, so modules come first.
      - name: Modules
        run: go mod download

      - name: Tests, isolated
        run: scripts/test-isolated

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: go build
        run: go build ./...

      - name: Personal data
        env:
          PERSONAL_PATTERNS: ${{ secrets.PERSONAL_PATTERNS }}
        run: scripts/personal-data-scan
