# .mint.toml — mint configuration. Only keys that differ from mint's compiled
# defaults are set; everything else rides on the defaults. Full key reference
# and defaults: run `mint setup`.

# Tracked churn that isn't user-facing release content, kept out of the AI
# release notes and commit diffs so they describe the CLI: agent config and
# contributor rules, the design doc, the gate, test-isolation and release
# tooling, CI plumbing, lockfile noise, and test scaffolding. Tests and their golden
# fixtures are the bulk of any change's diff, enough to crowd the behaviour
# out of the notes.
diff_exclude = [
    '.claude/**',
    'CLAUDE.md',
    'docs/**',
    'scripts/**',
    '.github/**',
    'go.sum',
    '**/*_test.go',
    '**/testdata/**',
]

[release.hooks]
# CI is off until kit is ready, and no CI job builds a release: both happen
# on this Mac, before the notes and the irreversible tag and push. press check
# (preflight) fails in seconds where the signing keychain won't open or the
# notary login has lapsed, before mint writes notes. scripts/gates runs every
# gate, the personal-data scan included; then press prepare builds what
# .press.toml names, kit.app and kit, signed with this Mac's Developer ID and
# notarised, and keeps them, so a failure building or checking them stops the
# release before its tag, with nothing public yet.
preflight = ['press check']
pre_tag = ['scripts/gates', 'press prepare']
# Once the tag and the release are up: press upload uploads the kept binaries
# to the release and moves the Homebrew formula on to them. mint only warns
# when it fails, so press upload <version>, run by hand, finishes the release.
post_release = ['press upload']

[release]
diff_exclude = [".gitignore", "art/", "cmd/capturetool/", "cmd/kitapp/", "demo/", "internal/capture/", "internal/boot/boottest/", "internal/render/rendertest/", "internal/runner/runnertest/", "internal/testguard/", ".press.toml", "internal/screen/screentest/"]
